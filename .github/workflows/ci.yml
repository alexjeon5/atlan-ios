# SPDX-License-Identifier: GPL-2.0-or-later
name: Runtime
on:
  push:
    branches: [main]  # work branches are merged straight to main; their own pushes would only repeat the run
  pull_request:
# A newer push to the same ref replaces a run that is still queued or running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DATLAN_SANITIZERS=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - name: Metal render tests (macOS only; reports a skip when the runner has no GPU)
        run: if [ -x build/metal-render-tests ]; then ./build/metal-render-tests; fi
  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DATLAN_BUILD_IOS=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-ios --config Debug -- CODE_SIGNING_ALLOWED=NO
      - run: cmake --build build-ios --config Release -- CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          app=$(find build-ios -type d -name AtlanRuntime.app -path '*Release-iphoneos*' | head -1)
          test -n "$app"
          mkdir -p out/ipa/Payload
          cp -R "$app" out/ipa/Payload/
          (cd out/ipa && zip -qry ../AtlanRuntime-unsigned.ipa Payload)
          unzip -l out/AtlanRuntime-unsigned.ipa | grep -c 'Payload/AtlanRuntime.app/AtlanRuntime$'
          if unzip -l out/AtlanRuntime-unsigned.ipa | grep -Ei '\.(so|apk|dat)$'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: atlan-runtime-ios-unsigned
          path: out/AtlanRuntime-unsigned.ipa
          if-no-files-found: error
  macos-universal:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DATLAN_BUILD_MACOS=ON
      - run: cmake --build build-macos --parallel 3
      - run: ctest --test-dir build-macos --output-on-failure
      - run: |
          lipo build-macos/atlan-poc -verify_arch arm64 x86_64
          lipo build-macos/runtime-tests -verify_arch arm64 x86_64
          lipo build-macos/atlan-elf -verify_arch arm64 x86_64
          lipo build-macos/elf-tests -verify_arch arm64 x86_64
          lipo build-macos/platform/macos/AtlanRuntimeMac.app/Contents/MacOS/AtlanRuntimeMac -verify_arch arm64 x86_64
          cmake --install build-macos --prefix out/macos
          codesign --force --deep --sign - out/macos/AtlanRuntimeMac.app
          ditto -c -k --keepParent out/macos out/atlan-runtime-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: atlan-runtime-macos-universal
          path: out/atlan-runtime-macos-universal.zip
          if-no-files-found: error
